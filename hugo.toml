baseURL = "/"
languageCode = "en"
title = "Corentin Dupaigne"
disableKinds = ["taxonomy", "term"]

# Site text lives in data/site.yaml so it can be edited from /admin/.

# Let standalone images escape their <p> so the image render hook can emit a
# bare <figure> (see layouts/_default/_markup/render-image.html).
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

# Emit CSS classes instead of inline monokai styles so code blocks can use the
# site palette (see the .chroma rules in assets/css/style.css).
[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false
