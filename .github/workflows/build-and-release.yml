name: build and release

on:
  push:
    branches: [main]

# The final step of this workflow pushes a commit back to main. GitHub skips
# workflow runs for commits whose message contains "[skip ci]", which is what
# breaks the loop — see the commit message in the "record release" step.
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  # Must match image.repository in helm/portfolio/values.yaml.
  IMAGE: ghcr.io/corentin-dupaigne/portfolio-v2/portfolio-v2

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the new image tag back to values.yaml
      packages: write # to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable, one-to-one with the commit. This is what makes the rendered
      # Deployment change, which is the only reason Argo CD rolls anything out.
      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: record release in values.yaml
        env:
          TAG: ${{ github.sha }}
        run: |
          # Deliberately sed rather than yq: it rewrites one line in place and
          # preserves the surrounding comments, and it needs nothing installed.
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|" helm/portfolio/values.yaml

          grep -q "  tag: \"${TAG}\"" helm/portfolio/values.yaml \
            || { echo "::error::failed to write image tag into values.yaml"; exit 1; }

          if git diff --quiet -- helm/portfolio/values.yaml; then
            echo "image tag unchanged; nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/portfolio/values.yaml
          git commit -m "chore(release): deploy ${TAG} [skip ci]"
          git push
