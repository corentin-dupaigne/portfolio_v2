{{- /* Journal list row. Context: dict "page" <Page> "format" <date layout>. */ -}}
{{- with .page -}}
<li>
  <a href="{{ .RelPermalink }}">
    <time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format ($.format | default "2006-01-02") }}</time>
    <span class="entry-title">{{ .Title }}</span>
    {{ partial "tags.html" . }}
  </a>
</li>
{{- end -}}
