{{- /* GitHub-style alerts become callouts:  > [!NOTE] / [!TIP] / [!IMPORTANT] / [!WARNING] / [!CAUTION] */ -}}
{{- if eq .Type "alert" -}}
<aside class="callout callout-{{ .AlertType }}">
  <p class="callout-title">{{ with .AlertTitle }}{{ . }}{{ else }}{{ .AlertType }}{{ end }}</p>
  {{ .Text }}
</aside>
{{- else -}}
<blockquote>
  {{ .Text }}
</blockquote>
{{- end -}}
